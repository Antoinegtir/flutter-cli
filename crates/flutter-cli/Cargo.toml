[package]
name = "flutter-cli"
version = "0.4.9"
description = "Modern terminal UI for Flutter — hot reload across N devices, live HTTP/perf inspector, drops into your shell so 'flutter run' becomes the dashboard."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["flutter", "dart", "tui", "cli", "mobile"]
# crates.io allows 5 categories. Picked for max search overlap with
# devs looking for terminal tools / dev productivity.
categories = ["command-line-utilities", "development-tools", "development-tools::debugging"]

[[bin]]
name = "flutter-cli"
path = "src/main.rs"

[dependencies]
fl-core = { path = "../fl-core" }
fl-adb = { path = "../fl-adb" }
fl-flutter = { path = "../fl-flutter" }
fl-vmservice = { path = "../fl-vmservice" }
fl-tui = { path = "../fl-tui" }
fl-ios = { path = "../fl-ios" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
futures-util.workspace = true
crossterm.workspace = true
serde_json.workspace = true
serde = { workspace = true }
# serde_yaml_ng: actively-maintained community fork of the (now
# deprecated) serde_yaml. We moved off `serde_yml` because that fork
# shipped a parsing regression in a 0.0.x patch (Dependabot #46) and
# has a poor maintenance reputation. `serde_yaml_ng` keeps the exact
# same `from_str` API, so the swap is a one-line import change.
serde_yaml_ng = "0.10"
chrono.workspace = true
url.workspace = true
